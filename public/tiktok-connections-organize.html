<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新建项目与分组</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/tiktok-connections.css" />

  <link rel="stylesheet" href="/theme-ops.css" data-lf-theme="light">
<link rel="stylesheet" href="/admin-ui.css" data-lf-console="true">
<script src="/admin-ui.js" defer></script>
</head>
  <body class="work-page connection-page lf-console" data-connections-page="organize">
    <nav class="side-tabs">
      <a class="app-brand" href="/tasks" aria-label="Local Factory">
        <span>LF</span><b>Local Factory<small>内容自动化</small></b>
      </a>
      <a href="/tasks">Reddit 自动发布</a>
      <a href="/stats">发布记录</a>
      <a href="/analytics">数据总览</a>
      <a data-admin-only class="is-active" href="/tiktok-connections">TikTok 账号</a>
      <a data-admin-only href="/accounts">账户管理</a>
      <button class="nav-logout" type="button" data-logout>退出登录</button>
    </nav>

    <main class="connection-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">OFFICIAL TIKTOK DATA</p>
          <h1>新建项目与分组</h1>
          <p>先建项目，再在项目下建分组。账号勾选与移入请回列表页操作。</p>
        </div>
        <a class="secondary-button link-button" href="/tiktok-connections">返回账号列表</a>
      </header>

      <section class="workflow-section">
        <div class="section-head">
          <span>01</span>
          <div><h2>新建</h2><p>项目是上层，分组必须属于一个项目。</p></div>
        </div>
        <div class="account-panels">
          <section class="account-panel">
            <h3>新建项目</h3>
            <div class="account-toolbar create-toolbar">
              <label><span>项目名称</span><div class="path-picker"><input id="newProjectName" type="text" maxlength="40" placeholder="例如：小说推文" /><button id="createProjectBtn" class="primary-button" type="button">新建项目</button></div></label>
            </div>
          </section>
          <section class="account-panel">
            <h3>新建分组</h3>
            <div class="account-toolbar create-group-toolbar">
              <label><span>所属项目</span><select id="newGroupProject"><option value="">请选择项目</option></select></label>
              <label><span>分组名称</span><div class="path-picker"><input id="newGroupName" type="text" maxlength="40" placeholder="例如：A组" /><button id="createGroupBtn" class="primary-button" type="button">新建分组</button></div></label>
            </div>
          </section>
        </div>
      </section>

      <section class="workflow-section">
        <div class="section-head">
          <span>02</span>
          <div><h2>删除</h2><p>删除项目后，分组仍在，只是不再属于该项目。删除分组后，组内账号回到未分组。</p></div>
        </div>
        <div class="account-panels">
          <section class="account-panel">
            <h3>删除项目或分组</h3>
            <div class="account-toolbar manage-toolbar">
              <label><span>项目</span><select id="deleteProjectSelect"><option value="">请选择项目</option></select></label>
              <button id="deleteProjectBtn" class="secondary-button" type="button">删除所选项目</button>
              <label><span>分组</span><select id="deleteGroupSelect"><option value="">请选择分组</option></select></label>
              <button id="deleteGroupBtn" class="secondary-button" type="button">删除所选分组</button>
            </div>
          </section>
        </div>
        <div id="statusMessage" class="status-message" hidden></div>
      </section>
    </main>
    <script src="/access.js"></script>
    <script type="module" src="/tiktok-connections.js?v=20260917-2"></script>
  </body>
</html>
