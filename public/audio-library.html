<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音频素材库</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/audio-library.css" />
  </head>
  <body class="work-page audio-library-page">
    <nav class="side-tabs">
      <a class="app-brand" href="/tasks" aria-label="Local Factory"><span>LF</span><b>Local Factory<small>内容自动化</small></b></a>
      <a href="/reddit">Reddit 视频生成</a><a href="/asset-cutter">视频素材切割</a><a href="/asset-usage">素材使用率</a>
      <a href="/tasks">自动任务</a><a href="/stats">发布记录</a><a href="/analytics">数据分析</a>
      <a href="/novel-library">小说爆款书单</a><a class="is-active" href="/audio-library">音频素材库</a><a href="/analytics-settings">抓取配置</a>
    </nav>

    <main class="audio-shell">
      <header class="audio-header">
        <div><p>AUDIO PIPELINE</p><h1>音频素材库</h1><span>营销文案生成配音后自动保存在这里，可多选批量生成视频。</span></div>
        <div class="header-actions"><a class="quiet-action" href="/novel-library">返回小说书单</a><button id="refreshBtn" class="primary-action" type="button">刷新音频</button></div>
      </header>

      <div id="pageStatus" class="audio-status">正在读取音频素材库...</div>
      <section id="ttsSetup" class="tts-setup">
        <label><span>ElevenLabs Voice ID</span><input id="voiceId" type="text" placeholder="可留空：优先读取已有播客任务使用的声音" /></label>
        <button id="retryAudioBtn" class="primary-action" type="button" hidden>重新生成当前音频</button>
        <small>首次手动填写后会保存在本机浏览器；API Key 继续使用现有后端配置。</small>
      </section>

      <section class="audio-layout">
        <div class="library-panel">
          <div class="panel-head"><div><strong>已生成音频</strong><small id="audioCount">0 条</small></div><label><input id="selectAll" type="checkbox" /> 全选</label></div>
          <div id="audioList" class="audio-list"></div>
        </div>

        <aside class="batch-panel reddit-task-panel">
          <div class="panel-head"><div><strong>创建 Reddit 自动任务</strong><small>使用勾选的音频</small></div></div>
          <div class="task-flow"><b>01</b><span>勾选本次要使用的音频</span><b>02</b><span>跳转自动任务并选择素材组</span><b>03</b><span>设置账号、文案和发布时间</span></div>
          <div class="selected-summary"><strong id="selectedAudioCount">0</strong><span>条音频已选择</span></div>
          <button id="createRedditTaskBtn" class="primary-action batch-action" type="button">使用选中音频创建任务</button>
          <div id="batchStatus" class="batch-status">等待选择音频。</div>
        </aside>
      </section>
    </main>
    <script src="/audio-library.js" type="module"></script>
  </body>
</html>
