<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小说效果 · Local Factory</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/novel-effects.css">
</head>
<body class="work-page novel-effects-page">
  <nav class="side-tabs" aria-label="主导航"></nav>
  <main class="effects-shell">
    <header class="page-heading"><div><p class="eyebrow">NOVEL PERFORMANCE</p><h1>小说效果</h1><p class="page-copy">按小说与开头版本聚合真实发布视频数据，比较内容、账号和流失表现。</p></div></header>
    <section class="toolbar-card">
      <div class="control-group"><span class="control-label">数据策略</span><div class="segmented" id="sourceTabs"><button type="button" class="active" data-source="official_api">TikTok 官方 API</button><button type="button" data-source="third_party">GeeLark 第三方</button></div></div>
      <div class="control-group"><span class="control-label">统计周期</span><div class="segmented compact" id="daysTabs"><button type="button" data-days="7">近7天</button><button type="button" class="active" data-days="30">近30天</button></div></div>
      <form class="search-form" id="effectSearchForm"><label class="sr-only" for="effectSearch">搜索小说</label><input id="effectSearch" type="search" placeholder="搜索小说标题、分类或推广码"><button type="submit" class="primary-button">查询</button></form>
      <button type="button" class="ghost-button" id="effectRefresh">刷新</button>
    </section>
    <section class="source-status" id="sourceStatus" aria-live="polite"></section>
    <section class="summary-grid" id="summaryGrid" aria-label="小说效果汇总"></section>
    <section class="novel-list" id="novelResults"></section>
    <section class="unassigned-section" id="unassignedSection" hidden></section>
  </main>
  <script src="/access.js"></script>
  <script type="module" src="/novel-effects.js"></script>
</body>
</html>
