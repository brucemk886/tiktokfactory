<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>数据概览 · Local Factory</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/novel-effects.css">
    <link rel="stylesheet" href="/theme-ops.css" />
  </head>
<body class="work-page novel-effects-page" data-source="official_api">
  <nav class="side-tabs" aria-label="主导航"></nav>
  <main class="effects-shell">
    <header class="page-heading"><div><p class="eyebrow">NOVEL RANKING</p><h1>数据概览</h1><p class="page-copy">按播放量看今天、近 7 天、近 30 天跑得好的小说，以及对应改写版本。只统计 TikTok 官方 API 已映射到小说开头的真实发布数据。</p></div></header>
    <section class="toolbar-card">
      <div class="control-group"><span class="control-label">统计周期</span><div class="segmented compact" id="daysTabs"><button type="button" data-days="1">今天</button><button type="button" class="active" data-days="7">近7天</button><button type="button" data-days="30">近30天</button></div></div>
      <form class="search-form" id="effectSearchForm"><label class="sr-only" for="effectSearch">搜索小说</label><input id="effectSearch" type="search" placeholder="搜索小说标题、分类或推广码"><button type="submit" class="primary-button">查询</button></form>
      <button type="button" class="ghost-button" id="effectRefresh">刷新</button>
    </section>
    <section class="source-status" id="sourceStatus" aria-live="polite"></section>
    <section class="summary-grid" id="summaryGrid" aria-label="数据概览汇总"></section>
    <section class="novel-list" id="novelResults"></section>
    <div id="novelPager" class="novel-pager" hidden></div>
    <section class="unassigned-section" id="unassignedSection" hidden></section>
  </main>
  <script src="/access.js"></script>
  <script type="module" src="/novel-effects.js"></script>
</body>
</html>
