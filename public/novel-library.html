<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小说书单 · Local Factory</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/novel-library.css?v=20260826-15" />
    <link rel="stylesheet" href="/theme-ops.css" />
  </head>
  <body class="work-page novel-library-page">
    <nav class="side-tabs">
      <a class="app-brand" href="/tasks" aria-label="Local Factory"><span>LF</span><b>Local Factory<small>内容自动化</small></b></a>
    </nav>

    <main class="library-shell">
      <header class="library-header">
        <div>
          <p class="library-kicker">NOVEL CATALOG</p>
          <h1 id="pageTitle">小说书单</h1>
          <p id="pageLead">只显示正在用的书：手建、有文案或有音频。飞书灌进来的空书留在总表，给同行爆款对书用。</p>
        </div>
        <div class="library-header-actions">
          <button id="importFeishuBtn" class="quiet-action" type="button">飞书导入</button>
          <button id="createBookBtn" class="primary-action" type="button">新增小说</button>
        </div>
      </header>

      <section id="catalogView" class="catalog-view">
        <div class="catalog-tabs" role="tablist" aria-label="小说平台">
          <button type="button" class="catalog-tab is-active" data-platform="all">全部平台</button>
          <button type="button" class="catalog-tab" data-platform="GoodNovel">GoodNovel</button>
          <button type="button" class="catalog-tab" data-platform="MotoNovel">MotoNovel</button>
          <button type="button" class="catalog-tab" data-platform="NovelMaster">NovelMaster</button>
        </div>
        <div class="shelf-tabs" role="tablist" aria-label="书单视图">
          <button type="button" class="shelf-tab is-active" data-shelf="library">全书库</button>
          <button type="button" class="shelf-tab" data-shelf="featured">重点书单</button>
        </div>
        <div class="list-toolbar">
          <div id="listStatus" class="list-status">正在读取小说书单...</div>
          <label><span class="sr-only">搜索小说</span><input id="searchInput" type="search" placeholder="搜索名称、书籍id、推广码或推广文案" /></label>
        </div>
        <div id="batchBar" class="batch-bar" hidden>
          <label class="batch-check-all">
            <input id="selectVisibleBtn" type="checkbox" />
            全选当前列表
          </label>
          <button id="batchAudioBtn" class="primary-action" type="button">勾选的每本出 3 条文案到音频页</button>
          <span id="batchStatus" role="status">先勾书。每本先读免费章节再选模板写 3 条钩子，保存到音频页，不配音。已有 3 条的会跳过。本机工人不要关。</span>
        </div>
        <div class="book-table-wrap">
          <table class="book-table">
            <colgroup>
              <col class="col-check" />
              <col class="col-date" />
              <col class="col-title" />
              <col class="col-platform" />
              <col class="col-book-id" />
              <col class="col-promo" />
              <col class="col-audio" />
              <col class="col-mark" />
              <col class="col-actions" />
            </colgroup>
            <thead>
              <tr>
                <th class="cell-check"><span class="sr-only">选择</span></th>
                <th>导入时间</th>
                <th>书名</th>
                <th>平台</th>
                <th>书籍id</th>
                <th>推广码</th>
                <th>已生成音频</th>
                <th>重点</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="bookList"></tbody>
          </table>
        </div>
        <div id="bookPager" class="book-pager" hidden></div>
      </section>

      <section id="editorView" class="editor-view" hidden>
        <form id="bookForm" class="book-editor">
          <div class="section-heading">
            <div><span>BOOK DETAILS</span><h2 id="editorTitle">新增小说</h2></div>
            <button id="cancelEditBtn" class="text-action" type="button">返回书单</button>
          </div>
          <input id="bookId" type="hidden" />
          <label><span>小说名称</span><input id="bookTitle" type="text" maxlength="180" placeholder="例如：The Housemaid" required /></label>
          <div class="field-row">
            <label>
              <span>小说平台</span>
              <select id="bookPlatform" required>
                <option value="">请选择小说平台</option>
                <option value="GoodNovel">GoodNovel</option>
                <option value="MotoNovel">MotoNovel</option>
                <option value="NovelMaster">NovelMaster</option>
              </select>
            </label>
            <label><span>频道 / 分类</span><input id="bookCategory" type="text" maxlength="120" placeholder="例如：女频 / 虐恋 / 言情" /></label>
          </div>
          <div class="field-row">
            <label><span>书籍id</span><input id="bookSourceId" type="text" maxlength="240" placeholder="飞书「书籍id」或「英文书ID」" /></label>
            <label><span>小说对应推广码</span><input id="bookPromotionCode" type="text" maxlength="240" placeholder="搜索词请自己填" /></label>
          </div>
          <div class="field-row">
            <label><span>小说卖点</span><input id="bookSellingPoint" type="text" maxlength="2000" placeholder="飞书「小说卖点」" /></label>
            <label><span>备注</span><input id="bookNote" type="text" maxlength="2000" placeholder="飞书「备注」" /></label>
          </div>
          <label class="check-field">
            <input id="bookFeatured" type="checkbox" />
            <span>加入该平台重点书单</span>
            <small>创建时的人工标记。每个平台各自维护一份重点书单。</small>
          </label>
          <div class="promo-copy-field">
            <span>推广文案</span>
            <p id="bookPromotionCopy" class="promotion-copy-display"></p>
          </div>
          <label><span>小说免费章节</span><textarea id="bookChapters" maxlength="200000" placeholder="粘贴可用于改写和生成配音文案的免费章节正文，至少 20 个字符" required></textarea><small id="chapterCount">0 / 200,000</small></label>
          <div class="form-actions">
            <button id="saveBookBtn" class="primary-action" type="submit">保存小说</button>
            <button id="deleteBookBtn" class="quiet-action delete-button" type="button" hidden>删除小说</button>
            <button id="rewriteBookBtn" class="quiet-action" type="button" hidden>改写小说</button>
            <span id="formStatus" role="status"></span>
          </div>
        </form>
      </section>
    </main>

    <script src="/access.js"></script>
    <script src="/novel-library.js?v=20260827-1" type="module"></script>
  </body>
</html>
