<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>统一 API · Local Factory</title>
<link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/module-pages.css"><link rel="stylesheet" href="/factory-api.css"><link rel="stylesheet" href="/theme-ops.css" data-lf-theme="light"><link rel="stylesheet" href="/admin-ui.css" data-lf-console="true"><script src="/admin-ui.js" defer></script></head>
<body class="work-page module-page lf-console"><nav class="side-tabs" aria-label="主导航"><a class="app-brand" href="/"><span>LF</span><b>Local Factory<small>统一 API</small></b></a></nav>
<main class="module-main api-main"><header><p class="api-kicker">项目接口</p><h1>统一 API</h1><p>整个项目一把密钥，按模块调用。查询、导入、修改、生成、发布和自动运营使用同一权限。</p></header>
<p><a class="button" href="/factory-mcp">ChatGPT 连接与授权管理</a></p>
<p id="status" role="status" aria-live="polite">正在读取配置…</p>
<section class="api-panel" aria-labelledby="keyTitle"><h2 id="keyTitle">项目密钥</h2><p id="keyMeta">正在读取…</p><div class="api-actions"><button id="createKey" disabled>创建项目密钥</button><button id="revokeKey" disabled>撤销密钥</button></div><div id="secretBox" hidden><label>新密钥（仅本次显示）<input id="secret" type="password" readonly autocomplete="off" spellcheck="false"></label><div class="api-actions"><button id="copyKey">复制密钥</button><button id="hideKey">清除显示</button></div></div><p class="api-help">密钥沿用创建管理员的模块与账号范围。更换后旧项目密钥立即失效；不会改动现有任务。历史专用接口保持兼容。</p></section>
<section class="api-panel" aria-labelledby="guideTitle"><h2 id="guideTitle">交给 AI</h2><p>复制调用说明，再单独提供项目密钥。AI 可自行读取各模块的操作目录。</p><label>统一入口<input id="endpoint" readonly></label><div class="api-actions"><button id="copyGuide" disabled>复制 AI 调用说明</button><button id="downloadCatalog" disabled>下载完整接口目录</button></div><pre id="sample"></pre></section>
<section class="api-panel" aria-labelledby="catalogTitle"><div class="api-catalog-head"><h2 id="catalogTitle">模块与操作</h2><label>选择模块<select id="module" aria-label="选择模块"></select></label></div><p id="actionCount"></p><div id="actions"></div></section>
<dialog id="keyConfirm"><form method="dialog"><h2 id="confirmTitle">更换项目密钥</h2><p id="confirmText"></p><div class="api-actions"><button value="cancel">取消</button><button value="confirm">确认</button></div></form></dialog>
</main><script src="/access.js"></script><script src="/factory-api.js" defer></script></body></html>
