<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>本地执行队列 · Local Factory</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/local-queue.css?v=20260828-4">
  <link rel="stylesheet" href="/theme-ops.css">
</head>
<body class="work-page local-queue-page">
  <nav class="side-tabs" aria-label="主导航"></nav>
  <main class="queue-shell">
    <header class="queue-heading">
      <div>
        <p class="eyebrow">LOCAL WORKER</p>
        <h1>本地执行队列</h1>
        <p class="page-copy">进度在本机看。要停就点停止，不会去问线上。工人掉线会由本机守护自动拉起。</p>
      </div>
      <div class="queue-heading-actions">
        <button id="refreshQueueBtn" class="quiet-button" type="button">刷新</button>
        <a class="primary-button" href="/tasks">Reddit 混剪</a>
        <a class="quiet-button" href="https://factory.tiktokaitool.com/" target="_blank" rel="noreferrer">打开线上工厂</a>
      </div>
    </header>
    <section class="queue-summary" id="queueSummary"></section>
    <p class="page-copy" id="watchdogNote"></p>
    <section class="queue-list" id="queueList">
      <div class="empty-state">正在读取本机任务…</div>
    </section>
  </main>
  <script src="/access.js"></script>
  <script type="module" src="/local-queue.js?v=20260828-6"></script>
</body>
</html>
