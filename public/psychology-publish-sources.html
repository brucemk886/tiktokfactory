<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>心理学发布记录</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/psychology-pages.css"><link rel="stylesheet" href="/psychology-auto-publish.css"><link rel="stylesheet" href="/psychology-production.css"><link rel="stylesheet" href="/psychology-publish-sources.css">
<link rel="stylesheet" href="/theme-ops.css" data-lf-theme="light">
<link rel="stylesheet" href="/admin-ui.css" data-lf-console="true">
<script src="/admin-ui.js" defer></script>
</head>
<body class="work-page official-data-page psychology-module psychology-sources-page lf-console">
<nav class="side-tabs"><a class="app-brand" href="/"><span>LF</span><b>Local Factory<small>心理学</small></b></a><button class="nav-logout" type="button" data-logout>退出登录</button></nav>
<main class="official-data-shell auto-shell">
<header class="page-head"><div><h1>心理学发布记录</h1><p class="page-lead">每条自动发布的帖子：发到哪个账号、用了哪篇文案、对标哪条爆款，以及它是怎么做出来的。</p></div><nav class="page-links" aria-label="相关页面"><a href="/psychology-publish">心理学自动发布</a><a href="/psychology-copy-library">文案库</a></nav></header>
<div class="records-views" role="tablist" aria-label="记录类型">
<button type="button" role="tab" data-view="auto" aria-selected="true">自动发布</button>
<button type="button" role="tab" data-view="manual" aria-selected="false">手动复刻</button>
</div>
<section class="panel auto-section" id="autoView">
<div class="sources-toolbar">
<label class="field"><span>搜索</span><input id="query" maxlength="100" placeholder="批次、标题、爆款标题或链接"></label>
<label class="field"><span>发布时间</span><select id="range"><option value="all">全部</option><option value="today">今天</option><option value="yesterday">昨天</option><option value="7d">近 7 天</option><option value="30d">近 30 天</option></select></label>
<label class="field"><span>内容类型</span><select id="mediaType"><option value="">全部</option><option value="photo">图文</option><option value="video">视频</option></select></label>
<button type="button" id="searchBtn">查询</button>
</div>
<p id="listStatus" class="field-hint" role="status">正在读取发布记录…</p>
<div class="queue-wrap"><table class="queue-table sources-table"><thead><tr>
<th>批次 / 发布时间</th><th>类型</th><th>发布账号</th><th>我方帖子</th><th>对标爆款</th><th>标题</th><th>状态</th><th>操作</th>
</tr></thead><tbody id="rows"></tbody></table></div>
<div class="sources-pagination"><button id="prevPage" type="button">上一页</button><span id="pageInfo"></span><button id="nextPage" type="button">下一页</button></div>
</section>
<section id="manualView" hidden>
<div class="board-actions manual-actions"><p class="muted">从文案库「原帖复刻」手动生成的任务，按原素材制作，不会自动发布。</p><button id="refreshBoard" type="button">刷新任务</button></div>
<section class="board-counts" aria-label="任务统计" id="boardCounts"></section><p id="boardStatus" role="status">正在读取复刻任务…</p>
<div class="board-layout"><aside class="board-queue"><h2>手动复刻任务</h2><p class="muted">任务在云端执行，关闭页面不会中断。</p><div id="boardQueue"></div><div class="board-pagination"><button id="boardPrev" type="button">上一页</button><span id="boardPage"></span><button id="boardNext" type="button">下一页</button></div></aside>
<section id="boardDetail" class="board-detail" aria-label="复刻详情"><div class="board-empty"><h2>选择一个复刻任务</h2><p>查看原素材分镜、图片、文案和执行记录。</p></div></section></div>
</section>
</main>
<dialog id="detailDialog" class="record-detail-dialog" aria-labelledby="detailTitle">
<div class="record-detail-head"><h2 id="detailTitle">制作详情</h2><button type="button" id="closeDetail">关闭</button></div>
<section id="detailBody" class="board-detail"></section>
</dialog>
<script src="/access.js"></script><script src="/psychology-production.js"></script><script src="/psychology-publish-sources.js"></script>
</body></html>
