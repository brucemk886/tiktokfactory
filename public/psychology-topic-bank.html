<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>模板题库 · Local Factory</title>
<link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/theme-ops.css">
<link rel="stylesheet" href="/psychology-pages.css"><link rel="stylesheet" href="/psychology-auto-publish.css"><link rel="stylesheet" href="/psychology-topic-bank.css">
</head>
<body class="work-page official-data-page psychology-ops-page"><nav class="side-tabs"><a class="app-brand" href="/"><span>LF</span><b>Local Factory<small>心理学</small></b></a><button class="nav-logout" type="button" data-logout>退出登录</button></nav>
<main class="official-data-shell auto-shell"><header class="page-head"><div><h1>模板题库</h1><p class="page-lead">为 1、2、3 号模板分别管理题目，自动发布按对应模板抽取。</p></div><nav class="page-links" aria-label="相关页面"><a href="/psychology-publish">心理学自动发布</a><a href="/psychology-publish-sources">发布对标</a></nav></header>
<section class="panel auto-section"><div id="bankTabs" class="bank-tabs" role="group" aria-label="选择模板题库"></div><p id="bankHint" class="field-hint"></p><div id="bankCounts" class="bank-counts"></div>
<div class="bank-toolbar"><form id="searchForm"><input id="search" aria-label="搜索题目" maxlength="100" placeholder="搜索题目、内容或分类"><select id="enabledFilter" aria-label="启用状态"><option value="all">全部状态</option><option value="active">已启用</option><option value="inactive">已停用</option></select><button type="submit">查询</button></form><div class="bank-actions"><button id="importTopics" type="button">批量导入</button><button id="newTopic" type="button" class="primary-action">新增题目</button></div></div>
<p id="message" role="status" aria-live="polite"></p><div id="topicList" class="queue-wrap"></div><div class="bank-pagination"><span id="pageInfo"></span><button id="prevPage" type="button">上一页</button><button id="nextPage" type="button">下一页</button></div>
<p class="field-hint">已抽取次数在创建批次时记录。同一批次重试不重复计数；编辑或删除题目不会改变已创建任务的内容。</p></section></main>
<dialog id="editDialog" class="bank-dialog"><form id="editForm"><div class="section-title"><h2 id="editTitle">新增题目</h2><button type="button" data-close="editDialog" aria-label="关闭">×</button></div><p id="editBank" class="field-hint"></p><label>题目<input id="topicTitle" required maxlength="200" placeholder="填写此模板的视频题目"></label><label>内容 / 解读要点<textarea id="topicContent" rows="7" maxlength="5000" placeholder="可填写选项、脚本、答案或解读，留空时根据题目生成"></textarea></label><div class="auto-grid"><label>分类<input id="topicCategory" maxlength="60" placeholder="例如：关系、自我认知"></label><label>优先级<input id="topicPriority" type="number" min="0" max="100" value="50" required></label></div><label class="bank-check"><input id="topicEnabled" type="checkbox" checked>启用，允许自动发布抽取</label><p class="field-hint">优先级 0–100，数字越大越优先。</p><p id="editError" class="error" role="alert"></p><div class="bank-actions"><button type="button" data-close="editDialog">取消</button><button class="primary-action" type="submit">保存题目</button></div></form></dialog>
<dialog id="importDialog" class="bank-dialog"><form id="importForm"><div class="section-title"><h2>批量导入题目</h2><button type="button" data-close="importDialog" aria-label="关闭">×</button></div><p id="importBank" class="field-hint"></p><p>仅导入当前模板题库，每次最多 100 条。相同题目和内容自动跳过，三个题库互不混用。</p><button id="downloadTemplate" type="button">下载 CSV 空白模板</button><label>选择 UTF-8 CSV / JSON 文件<input id="importFile" type="file" accept=".csv,.json"></label><label>或粘贴 CSV / JSON<textarea id="importText" rows="9" placeholder="题目,内容,分类,优先级,启用"></textarea></label><p class="field-hint">题目必填；其余可选。JSON 使用对象数组，字段为 title、content、category、priority、enabled。</p><p id="importError" class="error" role="alert"></p><div class="bank-actions"><button type="button" data-close="importDialog">取消</button><button class="primary-action" type="submit">导入当前题库</button></div></form></dialog>
<script src="/access.js"></script><script type="module" src="/psychology-topic-bank.js"></script></body></html>
