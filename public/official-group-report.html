<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>运营报表 · Local Factory</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/official-analytics.css">

  <link rel="stylesheet" href="/official-group-report.css?v=20260918-2">
  <link rel="stylesheet" href="/psychology-pages.css">
  <script>if (location.pathname.replace(/\/$/, "") === "/psychology-effects") document.documentElement.classList.add("psychology-module");</script>
<link rel="stylesheet" href="/psychology-management-api.css"><link rel="stylesheet" href="/theme-ops.css" data-lf-theme="light">
<link rel="stylesheet" href="/admin-ui.css" data-lf-console="true">
<script src="/admin-ui.js" defer></script>
</head>
<body class="work-page official-data-page lf-console">
  <nav class="side-tabs" aria-label="主导航"></nav>
  <main class="official-data-shell">
    <header class="official-data-header">
      <div>
        <p class="toolbar-kicker">MODULE OPS REPORT</p>
        <h1 id="pageTitle">运营报表</h1>
        <p id="pageCopy">按今天、昨天、近7天和最近30天查看发布和播放。</p>
      </div>
    </header>
    <section class="official-toolbar panel ops-report-toolbar">
      <div class="ops-report-toolbar-row">
        <label class="ops-stat-switch">
          <span id="reportToggleLabel">已开统计</span>
          <input id="projectReportToggle" type="checkbox" disabled>
          <i></i>
        </label>
        <div class="segmented" id="periodTabs">
          <button type="button" data-period="today" class="is-active">今天</button>
          <button type="button" data-period="yesterday">昨天</button>
          <button type="button" data-period="7d">近7天</button>
          <button type="button" data-period="30d">最近30天</button>
        </div>
        <div class="ops-report-filters">
          <label>分组
            <select id="groupSelect"></select>
          </label>
          <button id="queryBtn" class="primary-link" type="button">查询</button>
        </div>
      </div>
      <p id="reportMeta" class="sync-state">正在读取报表…</p>
    </section>
    <section class="data-section panel" id="groupPanel"></section>
    <section class="overview-grid" id="summaryGrid"></section>
    <section class="data-section panel report-results" aria-label="视频表现与异常账号">
      <div class="segmented report-tabs" id="resultTabs" role="tablist" aria-label="统计分类">
        <button type="button" id="highTab" role="tab" data-result-tab="high" aria-controls="highSection" aria-selected="true">高播视频</button>
        <button type="button" id="lowTab" role="tab" data-result-tab="low" aria-controls="lowSection" aria-selected="false" tabindex="-1">低播视频</button>
        <button type="button" id="anomalyTab" role="tab" data-result-tab="anomaly" aria-controls="anomalySection" aria-selected="false" tabindex="-1">异常账号</button>
      </div>
      <div id="highSection" role="tabpanel" aria-labelledby="highTab"></div>
      <div id="lowSection" role="tabpanel" aria-labelledby="lowTab" hidden></div>
      <div id="anomalySection" role="tabpanel" aria-labelledby="anomalyTab" hidden></div>
    </section>
    <section class="data-section panel" aria-labelledby="normalHeading">
      <div class="section-title"><h2 id="normalHeading">正常播放视频</h2></div>
      <div id="normalSection"></div>
    </section>
    <div id="pageStatus" class="page-status"></div>
  </main>
  <script src="/access.js"></script>
  <script src="/official-group-report.js?v=20260920-1"></script>
<script type="module" src="/psychology-management-api.js"></script></body>
</html>
