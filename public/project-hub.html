<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>项目中台 · Local Factory</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/tasks.css" />
    <link rel="stylesheet" href="/project-hub.css" />
  </head>
  <body class="tasks-page hub-page">
    <aside class="tasks-sidebar">
      <a class="tasks-brand" href="/project-hub">
        <span class="brand-mark">LF</span>
        <span><strong>Local Factory</strong><small>内容自动化</small></span>
      </a>
      <nav class="tasks-nav" aria-label="主导航">
        <a data-admin-only href="/psychology-topics">心理学题目</a>
        <a data-admin-only href="/psychology">心理学视频自动化</a>
        <a data-admin-only href="/schulte">舒尔特训练</a>
        <a data-admin-only href="/ai">AI 创作</a>
        <a data-admin-only href="/asset-usage">素材使用率</a>
        <a href="/tasks">Reddit 自动发布</a>
        <a href="/stats">发布记录</a>
        <a href="/analytics">数据总览</a>
        <a data-admin-only href="/operator">小说 AI 自运营</a>
        <a class="is-active" data-admin-only href="/project-hub">项目中台</a>
        <a data-admin-only href="/analytics-settings">抓取配置</a>
        <a data-admin-only href="/accounts">账户管理</a>
      </nav>
      <div class="sidebar-safety">
        <span class="live-dot"></span>
        <div><strong>共享记忆已开启</strong><small>只保存项目与交接记录</small></div>
      </div>
      <button class="nav-logout" type="button" data-logout>退出登录</button>
    </aside>

    <div class="hub-workspace">
      <header class="hub-header">
        <div>
          <p class="hub-kicker">PROJECT MEMORY</p>
          <h1>项目中台</h1>
          <p>统一保存子项目边界、目标和交接记忆，不再维护独立执行队列。</p>
        </div>
        <div class="hub-header-actions">
          <span class="hub-badge">共享记忆</span>
          <button id="refreshHubBtn" class="quiet-button" type="button">刷新</button>
        </div>
      </header>

      <main class="hub-main">
        <section id="summaryStrip" class="summary-strip" aria-label="项目概览"></section>

        <section class="hub-console">
          <aside class="project-rail">
            <div class="rail-heading">
              <div><p class="section-label">PROJECTS</p><h2>Local Factory 子项目</h2></div>
              <button id="toggleProjectFormBtn" class="icon-command" type="button" title="新增子项目" aria-label="新增子项目">+</button>
            </div>
            <form id="projectForm" class="hub-form" hidden>
              <label><span>子项目名称</span><input id="projectName" required placeholder="例如：小说素材研究" /></label>
              <label><span>工作区内目录</span><input id="projectPath" required placeholder="当前仓库或仓库内目录" /></label>
              <label><span>页面入口</span><input id="projectRoute" placeholder="例如：/tasks" /></label>
              <label><span>目标</span><textarea id="projectObjective" rows="3" placeholder="这个子项目当前要验证什么"></textarea></label>
              <label><span>关键模块，一行一个</span><textarea id="projectModules" rows="3" placeholder="scripts/example.js&#10;public/example.js"></textarea></label>
              <div class="form-actions"><span id="projectFormStatus"></span><button class="primary-action" type="submit">保存项目</button></div>
            </form>
            <div id="projectList" class="project-list" role="listbox" aria-label="选择子项目"></div>
          </aside>

          <section class="project-detail">
            <div class="project-focus">
              <div>
                <p id="selectedProjectKind" class="section-label">LOCAL SUBPROJECT</p>
                <h2 id="selectedProjectName">选择一个子项目</h2>
                <p id="selectedProjectObjective">这里展示项目目标、入口和关键模块。</p>
              </div>
              <div class="focus-actions">
                <a id="openProjectLink" class="quiet-link" href="#" hidden>打开项目页面</a>
                <button id="toggleProjectStateBtn" class="quiet-button" type="button" hidden>暂停项目</button>
              </div>
            </div>
            <div id="projectScope" class="project-scope"></div>
          </section>
        </section>

        <section class="hub-panel memory-panel">
          <div class="panel-heading">
            <div><p class="section-label">SHARED MEMORY</p><h2>项目交接记录</h2></div>
            <span id="handoffMeta" class="hub-muted"></span>
          </div>
          <div class="memory-grid">
            <form id="handoffForm" class="handoff-form">
              <input id="handoffProject" type="hidden" />
              <label><span>当前决定、结果和下一步</span><textarea id="handoffSummary" rows="6" placeholder="记录当前项目的决定、结果和下一步"></textarea></label>
              <div class="handoff-actions"><span id="handoffStatus" class="inline-status"></span><button class="primary-action" type="submit">写入交接</button></div>
            </form>
            <div id="handoffList" class="handoff-list"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="/access.js"></script>
    <script src="/project-hub.js"></script>
  </body>
</html>
