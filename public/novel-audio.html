<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小说详情 · Local Factory</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/novel-audio.css?v=20260831-7" />
    <link rel="stylesheet" href="/theme-ops.css" />
  </head>
  <body class="work-page novel-audio-page">
    <nav class="side-tabs" aria-label="主导航"></nav>
    <main class="audio-shell">
      <header class="audio-header">
        <div>
          <p class="library-kicker">NOVEL AUDIO</p>
          <h1 id="pageTitle">小说详情</h1>
          <p id="pageLead">这里看已经导入或改写出声的音频。配音和改写都在改写页。</p>
        </div>
        <div class="header-actions">
          <a class="quiet-action" href="/novel-library">返回书单</a>
          <a id="rewriteLink" class="primary-action" href="/novel-rewrite">去改写</a>
        </div>
      </header>

      <section id="summary" class="audio-summary" hidden></section>

      <section class="openings-heading">
        <div>
          <p class="library-kicker">OPENINGS</p>
          <h2>已配音</h2>
          <p>同行爆款导入后会自动识别口播。改写出声也在改写页完成。保存到本机只是拷给混剪用。</p>
        </div>
      </section>
      <p id="listStatus" class="list-status">正在读取改写音频...</p>
      <div id="mixToolbar" class="mix-toolbar" hidden>
        <p>勾选后点保存，会覆盖拷到本机 F:\音频目录\平台\书名\，给混剪用。导入的小说音频会自动排队识别口播，最多同时 10 条。同行爆款的 TikTok 链接在卡片下方；本机配音可直接网页播放。</p>
        <button id="saveMixAudiosBtn" class="primary-action" type="button">保存生效音频到本机</button>
        <span id="mixStatus" role="status"></span>
      </div>
      <section id="audioList" class="audio-list"></section>
    </main>
    <script src="/access.js"></script>
    <script src="/novel-audio.js?v=20260831-13" type="module"></script>
  </body>
</html>
