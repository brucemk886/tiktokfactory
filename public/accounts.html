<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>账户管理 · Local Factory</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/theme-ops.css">
  <link rel="stylesheet" href="/accounts.css">
</head>
<body class="work-page accounts-page">
  <nav class="side-tabs" aria-label="主导航">
    <a class="app-brand" href="/" aria-label="Local Factory"><span>LF</span><b>Local Factory<small>账户管理</small></b></a>
    <button class="nav-logout" type="button" data-logout>退出登录</button>
  </nav>
  <main class="accounts-shell">
    <header class="page-header">
      <div>
        <h1>账户管理</h1>
        <p>管理登录账号，按大模块开关侧栏。GeeLark 请到 <a href="/geelark-profiles">GeeLark 账户配置</a>。</p>
      </div>
      <span class="header-badge">管理员 <b data-account-name></b></span>
    </header>

    <div class="accounts-layout">
      <section class="bs-card people-card">
        <div class="bs-card-head">
          <h2>已启用账号</h2>
          <button id="clearUserBtn" class="btn btn-outline" type="button">新建账号</button>
        </div>
        <div id="userList" class="people-list"></div>
      </section>

      <form id="userForm" class="bs-card account-form">
        <input id="userId" type="hidden">
        <div class="bs-card-head">
          <h2 id="formTitle">新建账号</h2>
        </div>
        <div class="form-grid">
          <label class="form-field">登录账号
            <input id="userName" class="form-control" required placeholder="英文、数字、_ 或 -">
          </label>
          <label class="form-field">角色
            <select id="userRole" class="form-control">
              <option value="operator">成员：只看打开的模块</option>
              <option value="admin">管理员：可管账号</option>
            </select>
          </label>
          <label class="form-field">密码
            <div class="password-field">
              <input id="userPassword" class="form-control" type="text" autocomplete="new-password" placeholder="至少 8 位">
              <button id="copyPasswordBtn" class="btn btn-outline" type="button">复制</button>
              <button id="togglePasswordBtn" class="btn btn-outline" type="button">隐藏</button>
            </div>
            <small id="passwordHint">管理员可以直接查看和修改各账号密码。</small>
          </label>
          <label class="switch-row">
            <input id="userActive" type="checkbox" checked>
            <span>启用此账号</span>
          </label>
        </div>

        <div class="module-block">
          <div class="module-block-head">
            <h3>可见模块</h3>
            <p id="userSidebarHint">打开大模块后，可点「子功能」去掉不想展示的页面。</p>
          </div>
          <div id="userSidebarModules" class="module-switch-list"></div>
        </div>

        <div class="module-block">
          <div class="module-block-head">
            <h3>账号分组</h3>
            <p>一个用户可以分配多个分组。成员登录后，数据概览、运营报表和视频发布只看这些分组里的账号。</p>
          </div>
          <div id="userAccountGroups" class="module-switch-list"></div>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit">保存账号</button>
          <button id="deleteUserBtn" class="btn btn-danger" type="button" hidden>删除账号</button>
          <p id="userStatus" class="auth-status"></p>
        </div>
      </form>
    </div>
  </main>
  <script src="/access.js"></script>
  <script src="/accounts.js?v=20260827-2"></script>
</body>
</html>
