<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>账户管理</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/access.css">
</head>
<body class="work-page">
  <nav class="side-tabs">
    <a class="app-brand" href="/tasks"><span>LF</span><b>Local Factory<small>内容自动化</small></b></a>
    <a data-admin-only href="/psychology-topics">心理学题目</a>
    <a data-admin-only href="/psychology">心理学视频自动化</a>
    <a data-admin-only href="/schulte">舒尔特训练</a>
    <a data-admin-only href="/ai">AI 创作</a>
    <a data-admin-only href="/asset-usage">素材使用率</a>
    <a href="/tasks">Reddit 自动发布</a>
    <a href="/stats">发布记录</a>
    <a href="/analytics">数据总览</a>
    <a data-admin-only href="/analytics-settings">抓取配置</a>
    <a class="is-active" href="/accounts">账户管理</a>
    <button class="nav-logout" data-logout>退出登录</button>
  </nav>
  <main class="stats-shell">
    <section class="stats-panel">
      <div class="stats-topbar">
        <div>
          <h1>账户与权限</h1>
          <p>为每个成员绑定 GeeLark 配置、可见账号分组和共享素材目录。</p>
        </div>
        <span class="muted">当前管理员：<b data-account-name></b></span>
      </div>

      <div class="account-grid">
        <section class="account-section">
          <h2>GeeLark 配置</h2>
          <form id="profileForm" class="account-form">
            <input id="profileId" type="hidden">
            <label>配置名称<input id="profileName" required placeholder="例如：小说账号组 A"></label>
            <label>API 地址<input id="profileBaseUrl" value="https://openapi.geelark.cn"></label>
            <label>App ID<input id="profileAppId"></label>
            <label>API Key <small>留空则保留原密钥</small><input id="profileApiKey" type="password"></label>
            <button type="submit">保存 GeeLark 配置</button>
            <p id="profileStatus" class="auth-status"></p>
          </form>
          <div id="profileList" class="account-list"></div>
        </section>

        <section class="account-section">
          <h2>登录账号</h2>
          <form id="userForm" class="account-form">
            <input id="userId" type="hidden">
            <label>登录账号<input id="userName" required placeholder="英文、数字、_ 或 -"></label>
            <label>角色
              <select id="userRole">
                <option value="operator">成员：仅任务和发布记录</option>
                <option value="admin">管理员：全部页面和配置</option>
              </select>
            </label>
            <div class="sidebar-permission-field">
              <span class="group-field-title">侧边栏显示</span>
              <span id="userSidebarModules" class="sidebar-checkbox-list"></span>
              <span class="group-field-meta">
                <small id="userSidebarHint">勾选后，该账号登录时才显示对应模块。</small>
                <span class="group-actions">
                  <button id="selectAllSidebarBtn" class="text-action" type="button">全选</button>
                  <button id="clearSidebarBtn" class="text-action" type="button">清空</button>
                </span>
              </span>
              <span class="sidebar-save-row">
                <small id="sidebarSaveStatus">编辑已有账号时，可单独保存角色和菜单勾选结果。</small>
                <button id="saveSidebarBtn" class="sidebar-save-button" type="button">保存角色与侧边栏</button>
              </span>
            </div>
            <label>GeeLark 配置<select id="userProfile"></select></label>
            <div class="group-permission-field"><span class="group-field-title">可查看 GeeLark 分组</span>
              <span id="userGroups" class="group-checkbox-list"></span>
              <span class="group-field-meta">
                <small id="userGroupsHint">选择 GeeLark 配置后自动读取分组</small>
                <span class="group-actions">
                  <button id="selectAllUserGroupsBtn" class="text-action" type="button">全选</button>
                  <button id="clearUserGroupsBtn" class="text-action" type="button">清空</button>
                  <button id="refreshUserGroupsBtn" class="text-action" type="button">刷新</button>
                </span>
              </span>
            </div>
            <label>可选共享目录 <small>成员只能选择该目录及其子文件夹，例如 G:\苏丽凤视频素材</small><input id="userAllowedDirectory" placeholder="G:\苏丽凤视频素材"></label>
            <label>密码 <small>编辑时留空表示不改密码</small><input id="userPassword" type="password"></label>
            <label class="inline-check"><input id="userActive" type="checkbox" checked> 启用此账号</label>
            <button type="submit">保存登录账号</button>
            <button id="clearUserBtn" class="subtle" type="button">新建账号</button>
            <p id="userStatus" class="auth-status"></p>
          </form>
          <div id="userList" class="account-list"></div>
        </section>
      </div>
    </section>
  </main>
  <script src="/access.js"></script>
  <script src="/accounts.js"></script>
</body>
</html>
