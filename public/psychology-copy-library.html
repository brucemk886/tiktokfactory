<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文案库 · 心理学</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/theme-ops.css"><link rel="stylesheet" href="/psychology-pages.css"><link rel="stylesheet" href="/psychology-auto-publish.css"><link rel="stylesheet" href="/psychology-creative.css"><link rel="stylesheet" href="/psychology-copy-library.css"></head><body class="work-page official-data-page psychology-module"><nav class="side-tabs"></nav><main class="official-data-shell auto-shell">
<header class="page-head"><div><h1>文案库</h1><p class="page-lead">新导入的同行爆款会自动提取原文；提取完成后按视频与图文归档。</p></div><nav class="page-links"><a href="/psychology-peer-hits">同行爆款</a><a href="/psychology-publish-designs">图文样式</a><a href="/psychology-publish">自动发布</a></nav></header>
<nav class="copy-tabs" aria-label="文案类型"><button id="originalTab" type="button" aria-pressed="true">同行原文</button><button id="reviewedTab" type="button" aria-pressed="false">已审核图文改写</button></nav>
<section id="originals" class="panel auto-section"><h2>同行原文</h2><p>这里只展示已提取完成的内容。视频保存口播与画面文字；图文按图片编号保存前6张文字。历史同行爆款不在这里自动补提取。</p>
<form id="originalSearchForm" class="copy-filters"><label>内容类型<select id="originalMedia"><option value="all">全部</option><option value="video">视频</option><option value="photo">图文</option></select></label><label>搜索文案<input id="originalQuery" type="search" placeholder="标题、原文或来源链接"></label><button type="submit">查询</button><button id="originalRefresh" type="button">刷新</button><button id="exportOriginalPage" type="button">导出本页原文</button></form>
<p id="originalSummary" role="status"></p><p id="originalMessage" role="status"></p><div id="originalList"></div><div class="comment-pagination"><button id="originalPrev" type="button">上一页</button><span id="originalPage"></span><button id="originalNext" type="button">下一页</button></div></section>
<section class="panel auto-section" id="copies" hidden><h2>已审核图文改写</h2><p>推荐用 Grokbot 批量改写后人工审核，再导入。相同来源使用同一个 sourceKey，不同改写版本使用不同 externalId；pages 按图片顺序填写，第一项就是首图。每篇1–6页，每次最多100篇。导入即启用，发布时还需创建批次。</p><p><button id="downloadExample">下载导入示例</button></p><form id="importForm"><label>选择 JSON 文件<input id="copyFile" type="file" accept=".json,application/json"></label><label>或粘贴 JSON<textarea id="copyJson" rows="8" required placeholder='[{"externalId":"avoidant-v1","sourceKey":"attachment-001","title":"Post title","caption":"Post caption","pages":["Cover copy","Page 2 copy"]}]'></textarea></label><button type="submit" class="primary-action">导入已审核文案</button><p id="copyStatus" role="status"></p></form><form id="copySearchForm"><label>查找文案<input id="copySearch" type="search" placeholder="标题或来源编号"></label><button>查询</button></form><div id="copyList"></div><div class="comment-pagination"><button id="copyPrev">上一页</button><span id="copyPage"></span><button id="copyNext">下一页</button></div></section>
</main><script src="/access.js"></script><script type="module" src="/psychology-copy-library.js"></script></body></html>
