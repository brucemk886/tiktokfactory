<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>同行爆款 · Local Factory</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/novel-library.css?v=20260826-14" />
    <link rel="stylesheet" href="/novel-peer-hits.css?v=20260827-12" />
    <link rel="stylesheet" href="/theme-ops.css" />
  </head>
  <body class="work-page novel-library-page novel-peer-hits-page">
    <nav class="side-tabs">
      <a class="app-brand" href="/" aria-label="Local Factory"><span>LF</span><b>Local Factory<small>内容自动化</small></b></a>
    </nav>

    <main class="library-shell">
      <header class="library-header">
        <div>
          <p class="library-kicker">PEER HITS</p>
          <h1>同行爆款</h1>
          <p id="pageLead">把同行视频填进下面的输入框，也可以一起导入爆款音频。按 GoodNovel / MotoNovel / NovelMaster 对应书单。列表按播放量从高到低。勾选有音频、小说id和平台能对上书单的条目，一键写到该书音频页。要拷到本机，去小说音频页单独下载。</p>
        </div>
        <div class="library-header-actions">
          <button id="toggleImportBtn" class="primary-action" type="button">导入同行爆款</button>
        </div>
      </header>

      <section id="importPanel" class="import-panel" hidden>
        <div class="section-heading">
          <div><span>IMPORT</span><h2>导入同行爆款</h2></div>
        </div>
        <form id="importForm" class="import-form">
          <div class="field-row field-row-3">
            <label>
              <span>平台</span>
              <select id="importPlatform" required>
                <option value="">选择平台</option>
                <option value="GoodNovel">GoodNovel</option>
                <option value="MotoNovel">MotoNovel</option>
                <option value="NovelMaster">NovelMaster</option>
              </select>
            </label>
            <label><span>小说名称</span><input id="importNovelTitle" type="text" maxlength="180" placeholder="例如：My Husband Stole My Lifespan for His Ex" /></label>
            <label><span>小说id</span><input id="importNovelId" type="text" maxlength="240" placeholder="例如：5070518208" /></label>
          </div>
          <div class="field-row">
            <label><span>视频链接</span><input id="importVideoUrl" type="text" maxlength="800" placeholder="https://www.tiktok.com/@user/video/123" required /></label>
            <label><span>播放量</span><input id="importPlayCount" type="text" maxlength="40" placeholder="例如：128000 或 12.8万" /></label>
          </div>
          <div class="field-row field-row-3">
            <label><span>点赞</span><input id="importLikes" type="text" maxlength="40" placeholder="选填" /></label>
            <label><span>评论</span><input id="importComments" type="text" maxlength="40" placeholder="选填" /></label>
            <label><span>分享</span><input id="importShares" type="text" maxlength="40" placeholder="选填" /></label>
          </div>
          <label class="audio-field">
            <span>导入音频</span>
            <input id="importAudio" type="file" accept="audio/mpeg,.mp3" />
            <small>选填。把爆款口播 mp3 直接挂到这条同行视频上，列表里能试听。</small>
          </label>
          <div class="form-actions">
            <button id="importBtn" class="primary-action" type="submit">写入列表</button>
            <span id="importStatus" role="status"></span>
          </div>
        </form>
      </section>

      <section class="catalog-view">
        <div class="catalog-tabs" role="tablist" aria-label="小说平台">
          <button type="button" class="catalog-tab is-active" data-platform="all">全部平台</button>
          <button type="button" class="catalog-tab" data-platform="GoodNovel">GoodNovel</button>
          <button type="button" class="catalog-tab" data-platform="MotoNovel">MotoNovel</button>
          <button type="button" class="catalog-tab" data-platform="NovelMaster">NovelMaster</button>
        </div>
        <div class="shelf-tabs" role="tablist" aria-label="导入时间">
          <button type="button" class="shelf-tab is-active" data-range="all">全部</button>
          <button type="button" class="shelf-tab" data-range="today">今天</button>
          <button type="button" class="shelf-tab" data-range="7d">近7天</button>
          <button type="button" class="shelf-tab" data-range="30d">近30天</button>
        </div>
        <div class="list-toolbar">
          <div id="listStatus" class="list-status">正在读取同行爆款...</div>
          <label><span class="sr-only">搜索</span><input id="searchInput" type="search" placeholder="搜索小说名称、小说id、平台或视频链接" /></label>
        </div>
        <div id="batchBar" class="batch-bar">
          <label class="batch-check-all">
            <input id="selectVisibleBtn" type="checkbox" />
            全选本页未写入的
          </label>
          <button id="importToNovelsBtn" class="primary-action" type="button">一键导入小说音频</button>
          <span id="batchStatus" role="status">勾选有音频、还没写入音频页的条目。已写入的不会再导入。</span>
        </div>
        <div class="book-table-wrap">
          <table class="book-table peer-table">
            <colgroup>
              <col class="col-check" />
              <col class="col-date" />
              <col class="col-title" />
              <col class="col-imported" />
              <col class="col-platform" />
              <col class="col-book-id" />
              <col class="col-play" />
              <col class="col-video" />
              <col class="col-audio" />
              <col class="col-actions" />
            </colgroup>
            <thead>
              <tr>
                <th class="cell-check"><span class="sr-only">选择</span></th>
                <th>导入时间</th>
                <th>小说名称</th>
                <th class="cell-imported">是否已导入音频页</th>
                <th>平台</th>
                <th>小说id</th>
                <th>播放量</th>
                <th>视频链接</th>
                <th>音频</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="hitList"></tbody>
          </table>
        </div>
        <div id="hitPager" class="book-pager" hidden></div>
      </section>
    </main>

    <script src="/access.js"></script>
    <script src="/novel-peer-hits.js?v=20260827-12" type="module"></script>
  </body>
</html>
