<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心理学 · 模板工作台</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/hub.css" />
      <link rel="stylesheet" href="/theme-ops.css" />
    <style>[data-template-module][hidden] { display: none !important; }</style>
  </head>
  <body class="work-page hub-page">
    <nav class="side-tabs" aria-label="主导航">
      <a class="app-brand" href="/" aria-label="Local Factory"><span>LF</span><b>Local Factory<small>心理学</small></b></a>
      <button class="nav-logout" type="button" data-logout>退出登录</button>
    </nav>
    <main class="hub-shell">
      <header class="hub-hero">
        <p class="hub-kicker">心理学</p>
        <h1>模板工作台</h1>
        <p class="hub-lead">选择一个模板，开始制作心理学视频。</p>
      </header>
      <section class="hub-grid" aria-label="心理学模板">
        <a class="hub-card tone-psy" href="/psychology" data-template-module="psychology" hidden>
          <div class="hub-card-top"><em>01</em><i class="hub-card-mark">四</i></div>
          <strong>四图测试模板</strong>
          <span>四张图片搭配测试题目，引导观众选择并解读结果。</span>
          <b>打开模板 →</b>
        </a>
        <a class="hub-card tone-tool" href="/psychology-collage" data-template-module="psychology-collage" hidden>
          <div class="hub-card-top"><em>02</em><i class="hub-card-mark">纸</i></div>
          <strong>纸张拼贴模板</strong>
          <span>用纸张拼贴画面讲述心理学观点，搭配解说与双语字幕。</span>
          <b>打开模板 →</b>
        </a>
        <a class="hub-card tone-video" href="/psychology-target-2" data-template-module="psychology-narrative" hidden>
          <div class="hub-card-top"><em>03</em><i class="hub-card-mark">测</i></div>
          <strong>互动测试模板</strong>
          <span>用简短问题和结果揭晓，制作适合互动的心理测试视频。</span>
          <b>打开模板 →</b>
        </a>
      </section>
    </main>
    <script src="/access.js"></script>
  </body>
</html>
