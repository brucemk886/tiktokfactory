<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TikTok 账号</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/tiktok-connections.css" />
      <link rel="stylesheet" href="/theme-ops.css" />
  </head>
  <body class="work-page connection-page">
    <nav class="side-tabs">
      <a class="app-brand" href="/tasks" aria-label="Local Factory">
        <span>LF</span><b>Local Factory<small>内容自动化</small></b>
      </a>
      <a href="/tasks">Reddit 自动发布</a>
      <a href="/stats">发布记录</a>
      <a href="/analytics">数据总览</a>
      <a data-admin-only class="is-active" href="/tiktok-connections">TikTok 账号</a>
      <a data-admin-only href="/accounts">账户管理</a>
      <button class="nav-logout" type="button" data-logout>退出登录</button>
    </nav>

    <main class="connection-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">OFFICIAL TIKTOK DATA</p>
          <h1>TikTok 账号</h1>
          <p>在 TikTok AI Tool 完成官方授权，本地工厂只读取已授权账号及其视频数据。</p>
        </div>
        <a id="authorizeLink" class="primary-button link-button" href="https://tiktokaitool.com/dashboard?view=connect" target="_blank" rel="noreferrer">前往网站授权账号</a>
      </header>

      <section class="workflow-section" data-admin-only>
        <div class="section-head">
          <span>01</span>
          <div><h2>数据桥接</h2><p>配置 TikTok AI Tool 地址和本地工厂专用 API Key。</p></div>
        </div>
        <div class="settings-grid">
          <label>网站地址<input id="bridgeUrl" type="url" value="https://tiktokaitool.com" /></label>
          <label>API Key<input id="bridgeApiKey" type="password" placeholder="留空保持原密钥" autocomplete="off" /></label>
        </div>
        <div class="section-actions">
          <span id="settingsSummary">正在读取配置...</span>
          <div class="button-row">
            <button id="testButton" class="secondary-button" type="button">测试连接</button>
            <button id="saveButton" class="primary-button" type="button">保存配置</button>
          </div>
        </div>
      </section>

      <section class="workflow-section">
        <div class="section-head">
          <span>02</span>
          <div><h2>已授权账号</h2><p>先建项目，再在项目下建分组。账号数据在小说推文、中视频、心理学各自模块里看。</p></div>
          <button id="refreshButton" class="secondary-button" type="button">刷新账号</button>
        </div>
        <div class="account-panels">
          <section class="account-panel">
            <h3>筛选</h3>
            <div class="account-toolbar filter-toolbar">
              <label><span>项目</span><select id="projectFilter"><option value="">全部项目</option></select></label>
              <label><span>分组</span><select id="groupFilter"><option value="">全部分组</option></select></label>
              <label class="account-search"><span>搜索账号</span><input id="accountSearch" type="search" placeholder="用户名或显示名" /></label>
            </div>
          </section>
          <section class="account-panel">
            <h3>新建</h3>
            <div class="account-toolbar create-toolbar">
              <label><span>新建项目</span><div class="path-picker"><input id="newProjectName" type="text" maxlength="40" placeholder="例如：小说推文" /><button id="createProjectBtn" class="secondary-button" type="button">新建</button></div></label>
              <label><span>分组所属项目</span><select id="newGroupProject"><option value="">请选择项目</option></select></label>
              <label><span>新建分组</span><div class="path-picker"><input id="newGroupName" type="text" maxlength="40" placeholder="例如：A组" /><button id="createGroupBtn" class="secondary-button" type="button">新建</button></div></label>
            </div>
          </section>
          <section class="account-panel">
            <h3>移动</h3>
            <div class="account-toolbar assign-toolbar">
              <button id="selectVisibleBtn" class="secondary-button" type="button">全选筛选结果</button>
              <label><span>将已选移入</span><select id="assignGroupSelect"><option value="">未分组</option></select></label>
              <button id="assignGroupBtn" class="primary-button" type="button">移入分组</button>
              <span id="selectedCount" class="selected-count">已选 0 个</span>
            </div>
            <div class="account-toolbar move-group-toolbar">
              <label><span>将分组</span><select id="moveGroupSelect"><option value="">请选择分组</option></select></label>
              <label><span>移入项目</span><select id="moveGroupProjectSelect"><option value="">请选择项目</option></select></label>
              <button id="moveGroupToProjectBtn" class="primary-button" type="button">移入项目</button>
            </div>
            <div class="account-toolbar manage-toolbar">
              <button id="deleteProjectBtn" class="secondary-button" type="button">删除当前项目</button>
              <button id="deleteGroupBtn" class="secondary-button" type="button">删除当前分组</button>
            </div>
          </section>
          <section class="account-panel group-report-toolbar" id="groupReportBar" hidden>
            <h3>当前分组</h3>
            <div class="account-toolbar report-toolbar">
              <label><span>所属项目</span><select id="groupProjectSelect"><option value="">未分配项目</option></select></label>
              <button id="saveGroupProjectBtn" class="primary-button" type="button">移入项目</button>
            </div>
          </section>
        </div>
        <div id="statusMessage" class="status-message" hidden></div>
        <div id="accountList" class="account-list"><div class="empty-state">正在读取已授权账号...</div></div>
      </section>
    </main>
    <script src="/access.js"></script>
    <script type="module" src="/tiktok-connections.js?v=20260826-11"></script>
  </body>
</html>
