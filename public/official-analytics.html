<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>授权账号</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/official-analytics.css" />
      <link rel="stylesheet" href="/theme-ops.css" />
  </head>
  <body class="work-page official-data-page">
    <nav class="side-tabs"><a class="app-brand" href="/tasks" aria-label="Local Factory"><span>LF</span><b>Local Factory<small>内容自动化</small></b></a><button class="nav-logout" type="button" data-logout>退出登录</button></nav>
    <main class="official-data-shell">
      <header class="official-data-header">
        <div><p class="toolbar-kicker">AUTHORIZED TIKTOK ACCOUNTS</p><h1>授权账号</h1><p>查看已授权账号的官方数据，并进入独立的账号详情与视频数据页面。</p></div>
        <button id="syncOfficialData" type="button">立即同步</button>
      </header>
      <section class="official-toolbar panel">
        <div id="daysFilter" class="segmented"><button data-days="7">近7天</button><button data-days="30" class="is-active">近30天</button><button data-days="90">近90天</button><button data-days="all">全部</button></div>
        <input id="accountSearch" type="search" placeholder="搜索账号" />
        <small id="syncState" class="sync-state">读取中…</small>
      </section>
      <section id="overviewCards" class="overview-grid"></section>
      <section class="panel data-section">
        <div class="section-title"><div><p>AUTHORIZED ACCOUNTS</p><h2>账号列表</h2></div><span id="accountCount">0 个账号</span></div>
        <div class="table-wrap"><table><thead><tr><th>账号</th><th>粉丝</th><th>视频</th><th>播放</th><th>点赞</th><th>评论</th><th>分享</th><th>触达</th><th>同步时间</th><th>操作</th></tr></thead><tbody id="accountRows"></tbody></table></div>
      </section>
      <div id="pageStatus" class="page-status"></div>
    </main>
    <script src="/access.js"></script>
    <script src="/official-analytics-shared.js"></script>
    <script src="/official-analytics.js"></script>
  </body>
</html>
